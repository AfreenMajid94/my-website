<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookkaru · Sign Up</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1500835556837-99ac94a94552?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8dHJhdmVsfGVufDB8fDB8fHww');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        /* Overlay to make content readable */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        /* ---------- SIGNUP CONTAINER - TRANSPARENT WITH ORIGINAL BORDER ---------- */
        .signup-container {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 2.8rem 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        .signup-container .back-btn {
            position: absolute;
            top: 1.2rem;
            left: 1.5rem;
            color: #ffffff;
            font-size: 1.3rem;
            text-decoration: none;
            transition: 0.2s;
            opacity: 0.8;
        }

        .signup-container .back-btn:hover {
            color: #e63946;
            opacity: 1;
            transform: translateX(-4px);
        }

        .signup-container .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .signup-container .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .signup-container .logo h1 i {
            color: #e63946;
            margin-right: 8px;
        }

        .signup-container .logo p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .signup-container .form-group {
            margin-bottom: 1.2rem;
        }

        .signup-container .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.3rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .signup-container .form-group label .required {
            color: #e63946;
        }

        .signup-container .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .signup-container .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .signup-container .form-group input:focus {
            outline: none;
            border-color: #e63946;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2);
        }

        .signup-container .form-group input.error {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }

        .signup-container .form-group input.success {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2);
        }

        .signup-container .form-group .error-msg {
            color: #ff6b6b;
            font-size: 0.75rem;
            margin-top: 0.3rem;
            display: none;
        }

        .signup-container .form-group .error-msg.show {
            display: block;
        }

        .signup-container .password-wrapper {
            position: relative;
        }

        .signup-container .password-wrapper .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .signup-container .password-wrapper .toggle-password:hover {
            color: #ffffff;
        }

        .signup-container .signup-btn {
            width: 100%;
            padding: 0.8rem;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.3rem;
            box-shadow: 0 4px 16px rgba(230, 57, 70, 0.3);
        }

        .signup-container .signup-btn:hover {
            background: #c62828;
            transform: scale(1.02);
            box-shadow: 0 6px 24px rgba(230, 57, 70, 0.4);
        }

        .signup-container .divider {
            display: flex;
            align-items: center;
            margin: 1.2rem 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .signup-container .divider::before,
        .signup-container .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .signup-container .divider::before {
            margin-right: 1rem;
        }

        .signup-container .divider::after {
            margin-left: 1rem;
        }

        .signup-container .google-btn {
            width: 100%;
            padding: 0.7rem;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            backdrop-filter: blur(4px);
        }

        .signup-container .google-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #e63946;
            transform: scale(1.02);
        }

        .signup-container .google-btn i {
            color: #e63946;
            font-size: 1.2rem;
        }

        .signup-container .login-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .signup-container .login-link a {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .signup-container .login-link a:hover {
            text-decoration: underline;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 600px) {
            .signup-container {
                padding: 2rem 1.5rem;
            }
            .signup-container .logo h1 {
                font-size: 1.6rem;
            }
            .signup-container .back-btn {
                top: 0.8rem;
                left: 1rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <!-- Back Button -->
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

        <!-- Logo -->
        <div class="logo">
            <h1><i class="fas fa-ticket-alt"></i> Bookkaru</h1>
            <p>Create your account</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" novalidate>
            <!-- Username -->
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" id="username" placeholder="Enter your username" maxlength="30" required>
                <div class="error-msg" id="usernameError">⚠️ Username must be at least 3 characters </div>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="Enter your email address" required>
                <div class="error-msg" id="emailError">⚠️ Please enter a valid email address</div>
            </div>

            <!-- Phone Number - with dash after 4 digits -->
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="03XX-XXXXXXX" maxlength="12" required>
                <div class="error-msg" id="phoneError">⚠️ Please enter a valid 11-digit Pakistani phone number (03XX-XXXXXXX)</div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" maxlength="30" required>
                    <button type="button" class="toggle-password" id="togglePassword"><i class="fas fa-eye"></i></button>
                </div>
                <div class="error-msg" id="passwordError">⚠️ Password must be at least 6 characters</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" maxlength="30" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword"><i class="fas fa-eye"></i></button>
                </div>
                <div class="error-msg" id="confirmError">⚠️ Passwords do not match</div>
            </div>

            <!-- Signup Button -->
            <button type="submit" class="signup-btn"><i class="fas fa-user-plus"></i> Sign Up</button>
        </form>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Google Sign Up -->
        <button class="google-btn" id="googleSignUp">
            <i class="fab fa-google"></i> Sign up with Google
        </button>

        <!-- Login Link - Now links to signin.html -->
        <div class="login-link">
            Already have an account? <a href="signin.html">Sign in</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('signupForm');
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');

            const usernameError = document.getElementById('usernameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            const passwordError = document.getElementById('passwordError');
            const confirmError = document.getElementById('confirmError');

            // Toggle Password Visibility
            document.getElementById('togglePassword').addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (password.type === 'password') {
                    password.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    password.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });

            document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (confirmPassword.type === 'password') {
                    confirmPassword.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    confirmPassword.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });

            // ============================================
            // USERNAME VALIDATION (UPDATED)
            //    - Minimum 3 characters
            //    - Maximum 30 characters
            //    - Cannot be empty
            // ============================================
            function validateUsername() {
                const value = username.value.trim();
                
                if (value.length < 3 || value.length > 30) {
                    username.classList.add('error');
                    username.classList.remove('success');
                    usernameError.classList.add('show');
                    return false;
                } else {
                    username.classList.remove('error');
                    username.classList.add('success');
                    usernameError.classList.remove('show');
                    return true;
                }
            }

            // Email Validation
            function validateEmail() {
                const value = email.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(value)) {
                    email.classList.add('error');
                    email.classList.remove('success');
                    emailError.classList.add('show');
                    return false;
                } else {
                    email.classList.remove('error');
                    email.classList.add('success');
                    emailError.classList.remove('show');
                    return true;
                }
            }

            // Phone Number Formatting - dash after 4 digits
            function formatPhoneNumber() {
                let value = phone.value.replace(/\D/g, '');
                if (value.length > 11) {
                    value = value.slice(0, 11);
                }
                if (value.length >= 4) {
                    value = value.slice(0, 4) + '-' + value.slice(4);
                }
                phone.value = value;
            }

            function validatePhone() {
                const value = phone.value.replace(/\D/g, '');
                // Pakistani phone numbers: exactly 11 digits starting with 03
                const phoneRegex = /^03\d{9}$/;
                if (!phoneRegex.test(value)) {
                    phone.classList.add('error');
                    phone.classList.remove('success');
                    phoneError.classList.add('show');
                    return false;
                } else {
                    phone.classList.remove('error');
                    phone.classList.add('success');
                    phoneError.classList.remove('show');
                    return true;
                }
            }

            // Password Validation
            function validatePassword() {
                const value = password.value;
                if (value.length < 6) {
                    password.classList.add('error');
                    password.classList.remove('success');
                    passwordError.classList.add('show');
                    return false;
                } else {
                    password.classList.remove('error');
                    password.classList.add('success');
                    passwordError.classList.remove('show');
                    return true;
                }
            }

            // Confirm Password Validation
            function validateConfirmPassword() {
                const value = confirmPassword.value;
                if (value !== password.value || value === '') {
                    confirmPassword.classList.add('error');
                    confirmPassword.classList.remove('success');
                    confirmError.classList.add('show');
                    return false;
                } else {
                    confirmPassword.classList.remove('error');
                    confirmPassword.classList.add('success');
                    confirmError.classList.remove('show');
                    return true;
                }
            }

            // Real-time validation on input
            username.addEventListener('input', validateUsername);
            email.addEventListener('input', validateEmail);
            phone.addEventListener('input', function() {
                formatPhoneNumber();
                validatePhone();
            });
            password.addEventListener('input', validatePassword);
            confirmPassword.addEventListener('input', validateConfirmPassword);

            // ============================================
            // FORM SUBMISSION - FIXED
            // ============================================
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const isUsernameValid = validateUsername();
                const isEmailValid = validateEmail();
                const isPhoneValid = validatePhone();
                const isPasswordValid = validatePassword();
                const isConfirmValid = validateConfirmPassword();

                if (isUsernameValid && isEmailValid && isPhoneValid && isPasswordValid && isConfirmValid) {
                    const name = username.value.trim();
                    alert(`✅ Account created successfully!\n\nWelcome ${name} to Bookkaru!`);
                    window.location.href = 'index.html';  // ✅ FIXED
                } else {
                    const firstError = document.querySelector('.form-group input.error');
                    if (firstError) {
                        firstError.focus();
                    }
                    alert('⚠️ Please fix all errors before signing up.');
                }
            });

            // Google Sign Up
            document.getElementById('googleSignUp').addEventListener('click', function() {
                alert('🔐 Google Sign Up - Coming soon!');
            });
        });
    </script>
</body>
</html>
